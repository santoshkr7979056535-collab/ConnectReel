name: Build ConnectReel APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ConnectReel-Android-Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract ConnectReel project
        run: |
          unzip -q ConnectReel-Android-Project.zip
          cd connectreel-android
          echo "Project extracted"

      - name: Install dependencies
        working-directory: connectreel-android
        run: npm install

      - name: Build Android APK
              - name: Build Android APK
        working-directory: connectreel-android
        run: |
          echo "Checking Android project..."
          find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          GRADLEW=$(find . -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Android project structure:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Using Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectReel-APK
          path: connectreel-android/**/build/outputs/apk/debug/*.apk
